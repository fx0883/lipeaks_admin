name: Deploy Admin to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy LiPeaks Admin via SSH
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "=== 1. Pulling latest code for admin ==="
            cd /opt/lipeaks/lipeaks_admin
            git fetch origin main
            git reset --hard origin/main

            echo "=== 2. Rebuilding and restarting admin container ==="
            cd /opt/lipeaks
            docker compose up -d --no-deps --build admin

            echo "=== 3. Verifying admin status ==="
            docker compose ps admin
            echo "Admin deployment completed successfully!"
